<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<!-- Anatomia das Tags
    
- Abertura de tag -->
    <h1>
    <h2> Título </h2> <!-- Conteúdo da tag -->
    </h1> <!-- Fechamento de tag -->

    <!-- Elementos -->
<h1> Exemplo de Anatomia das Tags </h1>

    <!-- Atributos -->
     <a href="https://www.google.com.br">brasilsil</a> <!-- Domínio Brasileiro -->
     <a href="https://www.google.com" target="_blank">Visitar o google</a> <!-- Domínio Global -->

<br>

<!-- ## Neste exemplo:
 
    <a> é o elemento (link). 
        
    href é o atributo que indica o destino da URL.
    
    target="_blank" é o atributp que força o link a abrir em uma nova aba.
    
    -->

</body>
</html>
