    Principais Caracteres Reservados:
    
     < (Menor que): Inicia tags HTML.
     > (Maior que): Fecha tags HTML.
     & (E comercial / Ampersand): Inicia entidades HTML.
     " (Aspas duplas): Define atributos de tags.
     ' (Aspas simples): Define atributos de tags.
