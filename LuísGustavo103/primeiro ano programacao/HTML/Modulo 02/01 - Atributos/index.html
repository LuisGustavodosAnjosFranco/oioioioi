<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!--
    Atributos HTML são informações adicionais colocadas dentro da tag de abertura para modificar o comportamento ou a aparência de um elemento.O que são e como funcionamSeguem o formato de pares de nome e valor: nome="valor".Ficam sempre na tag de abertura do elemento.Dividem-se em globais (funcionam em qualquer tag) e específicos (usados apenas em elementos determinados).Você pode consultar a lista completa de referência na MDN Web Docs.Principais Atributos Globaisclass: define uma ou mais classes CSS para estilização ou seleção no JavaScript.id: identifica um elemento de forma única na página.style: aplica regras de estilo CSS diretamente no elemento.title: exibe um texto descritivo ao passar o mouse por cima do elemento.Principais Atributos Específicoshref: indica o destino (URL) de um link na tag <a>.src: define o caminho ou endereço de um arquivo externo, como imagens ou scripts.alt: fornece um texto alternativo para imagens caso elas não carreguem.placeholder: mostra um texto de dica dentro de campos de entrada (<input>).
    -->
</body>
</html>
