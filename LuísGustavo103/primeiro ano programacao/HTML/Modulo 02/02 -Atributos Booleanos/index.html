    <!--
    Atributos booleanos em HTML são aqueles que possuem apenas dois estados: verdadeiro (quando estão presentes na tag) e falso (quando estão ausentes).Como funcionamPresença = Verdadeiro: Se o atributo estiver escrito na tag, o comportamento dele é ativado.Ausência = Falso: Se você não colocar o atributo, ele simplesmente não é aplicado.Você não precisa (e nem deve) definir valores como true ou false.Exemplos comunsdisabled: Deixa o elemento desabilitado.checked: Deixa uma caixa de seleção marcada.required: Torna o preenchimento de um campo obrigatório.Formas de escreverSegundo a documentação oficial da MDN Web Docs, você pode declarar um atributo booleano destas maneiras:Apenas o nome: <input type="text" disabled>Com uma string vazia: <input type="text" disabled="">Com o próprio nome do atributo: <input type="text" disabled="disabled">
    -->
