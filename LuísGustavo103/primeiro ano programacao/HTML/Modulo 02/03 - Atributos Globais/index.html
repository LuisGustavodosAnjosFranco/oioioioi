<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <!--
  Atributos globais do HTML são propriedades que podem ser usadas em qualquer elemento de um documento.
    
Principais Atributos Globais:
    
    - class: Define uma ou mais classes CSS para estilizar ou selecionar o elemento.
    
    - id: Define um identificador único para o elemento na página.
    
    - style: Aplica regras de estilo CSS diretamente no elemento.
    
    - title: Adiciona um texto descritivo que aparece como dica ao passar o mouse.
    
    - lang: Especifica o idioma do conteúdo daquele elemento.
    
    - hidden: Esconde o elemento da visualização na página.
    
    - data-*: Permite armazenar dados personalizados próprios da aplicação no elemento.
    
    - draggable: Indica se o elemento pode ser arrastado com a API de Drag and Drop.
    
    - contenteditable: Torna o conteúdo do elemento editável pelo usuário.  
  -->  
</body>
</html>
