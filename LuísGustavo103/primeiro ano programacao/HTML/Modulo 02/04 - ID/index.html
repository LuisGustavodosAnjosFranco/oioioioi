<body>
    <!--
    O atributo id em HTML é um identificador único usado para nomear um elemento específico em toda a página.
    
    Regras Principais:
    
    - Unicidade: Cada id deve aparecer apenas uma vez por documento HTML.
    (Não repita o mesmo id em elementos diferentes.)
    
    - Formatação: Não pode conter espaços vazios e deve começar com uma letra por padrão de compatibilidade.
    
    
    Para que serve?
    
    CSS: Permite aplicar estilos visuais a um elemento específico usando o caractere cerquilha (#) antes do nome do id.
    
    JavaScript: Facilita a seleção e manipulação rápida do elemento no código por meio de funções como document.getElementById().
    
    Links internos: Funciona como um ponto de destino na página quando você usa links com o símbolo # seguido do nome do identificador.
    
    -->
</body>
</html>
