Class
    O que é e para que serve?
    
    Atributo global: Pode ser inserido em qualquer tag do HTML.
    
    Múltiplos elementos: Vários elementos diferentes podem compartilhar o mesmo nome de classe.
    
    Várias classes: Um único elemento pode ter mais de uma classe, separando os nomes por espaços.
    
    
    Principais utilizações:
    
    - Estilização com CSS: Permite selecionar um grupo de elementos usando um ponto (.) antes do nome da classe para mudar cores, fontes e tamanhos de uma só vez.
    
    - Manipulação com JavaScript: Facilita a seleção de coleções de elementos na página por meio de funções como getElementsByClassName.
    
    
    Diferença entre class e id:
    
    Classe (class):Não é exclusiva; vários elementos podem usar a mesma classe. No CSS, usa-se um ponto (.).
    
    Identificador (id): É único e exclusivo para um único elemento por página. No CSS, usa-se uma cerquila (#).Se você quiser,
