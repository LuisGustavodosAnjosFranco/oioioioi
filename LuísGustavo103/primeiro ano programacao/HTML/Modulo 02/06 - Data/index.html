<!DOCTYPE html>

<body>
    <!--
    1. Atributos data-* (Atributos Customizados)Os atributos data-* do HTML permitem que você armazene informações extras e proprietárias diretamente em elementos HTML comuns.Como usar: Você cria o atributo escrevendo data- seguido de um nome (exemplo: data-user-id="123" ou data-product-price="49.90").Acesso via JavaScript: É possível ler ou alterar esses valores facilmente usando a propriedade .dataset do elemento. Por exemplo, elemento.dataset.userId retorna "123".Vantagem: Evita requisições extras ao servidor ou uso de artifícios inválidos para guardar dados que o script da página precisa manipular.2. A tag <data> (Elemento de Dados)A tag <data> do HTML serve para vincular um conteúdo exibido na tela a uma tradução exata legível por máquinas.Como usar: Ela exige o atributo value com o dado padronizado, enquanto o texto visível fica dentro da tag.
    -->
</body>
</html>
