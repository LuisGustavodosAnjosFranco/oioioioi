<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    A Tag <style>
    
        A tag <style> serve para incluir código CSS interno no cabeçalho (<head>) de um documento HTML, afetando toda a página de uma só vez.
    
        Fica localizada dentro da tag <head>.
    
        Permite centralizar estilos para reutilização e fácil manutenção.
    
        Evita a repetição de código em elementos individuais.
    
    O Atributo style
    
        O atributo style é um atributo global usado para aplicar estilos CSS diretamente em uma tag HTML específica (estilo inline).
    
        É aplicado direto no elemento (ex: <p style="color: blue;">).
    
        Possui alta especificidade e sobrescreve regras de folhas de estilo externas ou internas.
    
        É ideal para testes rápidos ou ajustes pontuais.
    -->
</body>
</html>
