    <!--
    A semântica HTML é o uso correto de tags para dar significado ao conteúdo de uma página web, indicando a função de cada elemento em vez de definir sua aparência visual.O que é e como funcionaTags semânticas dizem ao navegador e aos buscadores o que o conteúdo representa (como um título, um rodapé ou um artigo).Tags não semânticas, como <div> e <span>, apenas agrupam dados sem explicar o que eles são.A aparência da página é papel exclusivo do CSS, enquanto a estrutura e o sentido pertencem ao HTML.Principais Tags Semânticas<header>: Define o cabeçalho de uma página ou seção.<nav>: Agrupa links de navegação.<main>: Indica o conteúdo central e principal do documento.<section>: Representa uma seção temática de conteúdo.<article>: Destina-se a conteúdos autônomos e independentes, como posts de blogs.<aside>: Guarda conteúdos secundários ou barras laterais relacionados ao redor.<footer>: Identifica o rodapé da página ou de uma seção.
    -->
