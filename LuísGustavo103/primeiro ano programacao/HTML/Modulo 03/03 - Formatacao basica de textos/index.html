    <!--
    A formatação básica de textos em HTML utiliza tags (etiquetas) para definir a estrutura, o estilo e a importância de cada parte do conteúdo na página web. Títulos e Parágrafos<h1> até <h6>: Definem os títulos da página. O <h1> é o título principal (maior) e o <h6> é o menor.<p>: Define um bloco de parágrafo de texto.Ênfase e Estilos de Texto<b> ou <strong>: Deixam o texto em negrito. A tag strong indica maior importância semântica.<i> ou <em>: Deixam o texto em itálico. A tag em indica ênfase no conteúdo.<u>: Adiciona um sublinhado ao texto.<del> ou <s>: Mostram um texto tachado (riscado).Outras Tags Úteis<br>: Cria uma quebra de linha simples no texto.<hr>: Insere uma linha horizontal divisória na página.<sub> e <sup>: Usados para texto subscrito
    -->
