    <!--
    As listas em HTML organizam conteúdos em itens estruturados usando as tags principais <ul>, <ol>, <dl> e <li>.
    
    Tipos de Listas em HTML
    
        - Listas Não Ordenadas (<ul>): Criam coleções de itens marcados com pontos ou círculos, onde a ordem dos elementos não importa.
    
        - Listas Ordenadas (<ol>): Criam sequências numeradas ou com letras, indicando que a ordem dos itens é relevante.
    
        - Listas de Descrição (<dl>): Agrupam termos e suas respectivas definições ou explicações.
    
        - Itens de Lista (<li>): Representam cada item individual dentro de uma lista <ul> ou <ol>.
    
        - Termo (<dt>) e Detalhe (<dd>): Definem o nome do termo e o seu significado em uma lista <dl>.
    -->
