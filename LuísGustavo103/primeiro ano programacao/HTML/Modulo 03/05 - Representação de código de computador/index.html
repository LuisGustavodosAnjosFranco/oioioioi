    <!--
    Principais Tags de Código
    
    - <code>: Define um trecho geral de código de computador. O texto geralmente aparece em fonte monoespaçada (como Courier).
    
    - <pre>: Define um texto pré-formatado. Mantém espaços e quebras de linha exatamente como digitados no código.
    
    - <kbd>: Representa a entrada de teclado, usada para indicar teclas que o usuário deve pressionar (ex: Ctrl + C).
    
    - <samp>: Representa a saída de amostra ou de erro de um programa de computador.
    
    - <var>: Define uma variável em programação ou em uma expressão matemática.
    
    - Exemplo PráticoPara exibir um bloco de código formatado na tela, combinamos as tags <pre> e <code>
    -->
</body>
