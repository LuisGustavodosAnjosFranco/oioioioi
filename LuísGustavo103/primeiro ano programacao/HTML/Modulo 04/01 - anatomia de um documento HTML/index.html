<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    A anatomia básica de um documento HTML é formada por elementos que organizam e descrevem o conteúdo de uma página web.
    

    Entendendo cada parte
    
- <!DOCTYPE html> — informa ao navegador que o documento utiliza HTML5.
    
- <html> — é o elemento raiz; contém todo o documento.
    
- lang="pt-BR" — informa que o idioma principal da página é português do Brasil.
    
- <head> — contém informações sobre a página que normalmente não aparecem diretamente no conteúdo.
    
- <meta charset="UTF-8"> — define a codificação de caracteres, permitindo acentos e outros símbolos.
    
- <meta name="viewport"...> — ajuda a página a se adaptar a diferentes tamanhos de tela.
    
- <title> — define o título exibido na aba do navegador.

- <body> — contém tudo aquilo que será apresentado ao usuário.

- <h1> — representa o título principal da página.

- <p> — representa um parágrafo.


    HTML
│
├── HEAD
│   ├── META
│   ├── META
│   └── TITLE
│
└── BODY
    ├── H1
    └── P

    -->
</body>
</html>
