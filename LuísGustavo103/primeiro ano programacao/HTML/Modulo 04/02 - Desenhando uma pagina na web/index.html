    <!--
                    Quando começamos a criar uma página web, podemos pensar nela como um desenho dividido em partes.
    Primeiro definimos a estrutura com HTML, depois cuidamos da aparência com CSS e, quando necessário, adicionamos comportamento com JavaScript.

        1 - Html - Desenha a estrutura

        2 - CSS - Desenha a aparência


        3. O processo mental
            Ao desenhar uma página, uma boa sequência é:

     - Imaginar o layout — como a página será dividida?
     - Criar a estrutura HTML — quais elementos existem?
     - Organizar o conteúdo — títulos, textos, imagens, links etc.
     - Estilizar com CSS — cores, fontes, espaçamento e posicionamento.
     - Adicionar interatividade com JavaScript, se necessário.

    
    -->
