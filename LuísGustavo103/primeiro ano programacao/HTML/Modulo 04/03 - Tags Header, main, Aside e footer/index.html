<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- 
    Essas são tags semânticas do HTML.
        Elas ajudam a organizar a página e deixam claro para o navegador, mecanismos de busca e tecnologias assistivas qual é a função de cada parte.

        <header>
1 - Representa o cabeçalho de uma página ou de uma seção.

2 - Normalmente pode conter:

    - Logo ou nome do site
    - Título
    - Menu de navegação
    - Informações introdutórias

        <main>
    Representa o conteúdo principal da página.

    É aquilo que constitui o assunto central daquela página.

    uma página normalmente deve conter apenas um main

       <aside>
1 - Representa um conteúdo complementar ou relacionado ao conteúdo principal.

2 - Pode ser usado para:

    - Barra lateral
    - Links relacionados
    - Publicidade
    - Biografia do autor
    - Conteúdo adicional

     <footer>
1 - Representa o rodapé de uma página ou seção.

2 - Pode conter:

    - Copyright
    - Informações de contato
    - Links
    - Políticas
    - Informações sobre o autor
    -->
</body>
</html>
