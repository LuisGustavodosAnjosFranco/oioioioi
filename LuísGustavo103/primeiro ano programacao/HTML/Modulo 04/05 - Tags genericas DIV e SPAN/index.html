    <!-- 
    Tags genéricas <div> e <span>
    
- As tags <div> e <span> são chamadas de elementos genéricos porque não indicam, por si só, qual é o significado do conteúdo dentro delas.

- Elas são muito utilizadas para organizar e estilizar elementos com CSS.

    <div>
A <div> é um elemento genérico de bloco.

Ela normalmente ocupa toda a largura disponível e começa uma nova linha.

    <span>
A <span> é um elemento genérico de linha (inline).

Diferentemente da <div>, ela normalmente não quebra a linha.

É muito útil para aplicar estilo ou identificar uma pequena parte de um texto

    
    -->
