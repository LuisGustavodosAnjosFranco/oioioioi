    <!--
    Caminhos relativos em pastas diferentes
- Os caminhos relativos são utilizados quando o arquivo que queremos acessar está em uma pasta diferente daquela onde está o arquivo atual.

- O caminho é definido a partir da localização do arquivo que está fazendo a referência.

- Quando precisamos acessar uma pasta que está dentro da pasta atual, basta indicar o nome dessa pasta e, em seguida, o nome do arquivo.

- Quando o arquivo está em uma pasta anterior, utilizamos .., que significa voltar uma pasta.

- Se for necessário voltar duas pastas, utilizamos ../... Para três pastas, ../../.., e assim por diante.
    -->
